# Netlify Configuration for Vue 3 App
# https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  # Directory with the build output
  publish = "dist"

  # Build command
  command = "npm run build"

# Redirect rules for SPA (Single Page Application)
# This ensures Vue Router works correctly on Netlify
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Optional: Environment variables (add these in Netlify UI instead)
# [build.environment]
#   NODE_VERSION = "18"
